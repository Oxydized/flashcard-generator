<main class="upload-page">
  <section class="upload-shell">
    <p class="eyebrow">Flashcard Generator</p>

    <h1>Turn Your Notes Into Flashcards</h1>

    <p class="upload-subtitle">
      Upload one or more .txt, .docx, or .pdf files and generate a study-ready deck.
    </p>

    <section class="upload-card">
      <label class="upload-dropzone">
        <input 
          type="file"
          accept=".txt,.docx,.pdf"
          multiple
          (change)="onFileSelected($event)" 
        />

        <span class="upload-icon">↑</span>

        <strong>
          {{
            selectedFiles.length === 0
              ? 'Choose one or more files to upload'
              : selectedFiles.length === 1
                ? selectedFiles[0].name
                : selectedFiles.length + ' files selected'
          }}
        </strong>

        <small>
          {{
            selectedFiles.length > 0
              ? 'Ready to generate flashcards'
              : 'TXT, DOCX, or PDF supported'
          }}
        </small>
      </label>

      <button 
        type="button"
        class="generate-button"
        [disabled]="selectedFiles.length === 0 || isLoading"
        (click)="generateFlashcards()"
      >
        {{ isLoading ? 'Generating...' : 'Generate Flashcards' }}
      </button>

      <p *ngIf="isLoading" class="loading-text">
        Creating your deck...
      </p>
    </section>
  </section>
</main>
