<main class="app-container">
  <h1>Study Mode</h1>

  <section *ngIf="flashcards.length > 0; else noCards">
    <p>
      Card {{ currentIndex + 1 }} of {{ flashcards.length }}
    </p>

    <div class="flashcard">
      <h3>{{ currentCard.front }}</h3>

      <p *ngIf="showAnswer">
        {{ currentCard.back }}
      </p>
    </div>

    <button type="button" (click)="previousCard()" [disabled]="currentIndex === 0">
      Back
    </button>

    <button type="button" (click)="toggleAnswer()">
      {{ showAnswer ? 'Hide Answer' : 'Show Answer' }}
    </button>

    <button type="button" (click)="nextCard()" [disabled]="currentIndex === flashcards.length - 1">
      Next
    </button>
  </section>

  <ng-template #noCards>
    <p>No flashcards loaded. Generate a deck first.</p>
  </ng-template>
</main>
